# Frozen configuration for the proposed model (PC-TFN).
# Selected by a validation-only component build-up and width sweep, then confirmed
# over 3 seeds (validation macro-F1 0.8028 +/- 0.0004).
# No value in this file may be edited based on test-split results.

final_model:
  name: PC_TFN
  display_name: "Physics-Calibrated Trajectory-Forecasting Network (PC-TFN)"
  config:
    channels: 40
    dilations: [1, 2, 4, 8]
    dropout: 0.1
    lr: 0.0015
    weight_decay: 1.0e-04
    batch_size: 512
    gamma: 1.0
    epochs: 40
    patience: 10
    pct_start: 0.25
    lambda_thermal: 1.0
    lambda_risk: 1.0
    focal: true
    use_thermal: true
    use_surrogate: true
    use_gate: true
    pooling: multi

data:
  train_split: "2018-01-01 to 2021-12-31, sites: san_francisco, phoenix, chicago, dallas"
  validation_split: "2022-01-02 to 2022-12-31, same 4 sites"
  test_split: "2023-01-02 to 2024-12-31, same 4 sites"
  external_test_split: "2023-01-02 to 2024-12-31, site: london (zero-shot, never used for fitting or selection)"
  feature_bundle_cache: data/features_v4
  split_manifest: DATA_SPLIT_MANIFEST.csv (regenerated by src/resilient_dc/data_pipeline.py)

preprocessing:
  standardization: "mean/std fit on train split only (Preprocessor in src/resilient_dc/modeling.py)"
  sequence_window_hours: 24
  label_horizon_hours: 6
  label_definition: "max(current_risk_class) over t+1..t+6"
  auxiliary_targets: "t+1..t+6 thermal trajectory and physics risk scores; training-split supervision only, never model inputs"

training_protocol:
  optimizer: AdamW with OneCycle schedule (pct_start above)
  loss: >
    class-weighted focal loss (gamma above), class weights = sqrt(N / N_y) normalized to mean 1,
    plus two auxiliary Huber regression terms: the t+1..t+6 thermal trajectory
    (temperature/relative humidity/dew point, lambda_thermal) and the t+1..t+6 physics risk
    scores on a log1p scale (lambda_risk). Both auxiliary targets are derived from the same
    disclosed simulator that defines the label, are used as training-split supervision only,
    and are never model inputs at inference time.
  early_stopping: "validation macro-F1, patience=10, up to 40 epochs"
  model_selection_metric: validation macro-F1
  calibration: "post-hoc temperature scaling (LBFGS, NLL objective), fit on validation split only, per seed"
  abstention: "entropy threshold selected on validation split for a 10% target abstention rate, per seed"
  reporting: >
    Metrics are reported at full coverage (every hour auto-classified) and at the
    validation-selected 90% coverage operating point of the abstention rule, together with
    per-class coverage so the deferral composition is visible.

seeds:
  candidate_screening: [17, 29, 43]
  final_evaluation: [17, 29, 43, 71, 88, 101, 113, 127, 139, 151]
  ablation: [17, 29, 43, 71, 88, 101, 113, 127, 139, 151]
  robustness_and_low_data: [17, 29, 43, 71, 88]
